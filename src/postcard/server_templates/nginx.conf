# Postcard: unlisted Obsidian pages.  /etc/nginx/sites-available/{domain}
# Enable:  ln -s /etc/nginx/sites-available/{domain} /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# HTTPS:   certbot --nginx -d {domain}      (adds the 443 block + redirect)

server {{
    listen 80;
    listen [::]:80;
    server_name {domain};

    root {root}/site;
    autoindex off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;   # the shared CSS is ~1.1 MB raw, ~300 KB gzipped
    gzip_min_length 1024;
    server_tokens off;
    include snippets/postcard-headers.conf;

    location = /robots.txt {{
        include snippets/postcard-headers.conf;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }}

    # Shared CSS/fonts and per-page images are content-hashed: cache forever.
    # (add_header inside a location replaces the server-level ones, hence the include.)
    location ~ "^/(_s|[A-Za-z0-9]{{12}}/a)/[^/]+$" {{
        include snippets/postcard-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }}

    # /<id>  /<id>/  /<id>/<any-slug>  -> the page. The slug is cosmetic.
    location ~ "^/([A-Za-z0-9]{{12}})(/[^/]*)?/?$" {{
        include snippets/postcard-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /$1/index.html =404;
    }}

    # The mailbox page at "/". It doubles as the 404 page ("Return to sender") for dead links.
    # Upload it with: postcard server home
    error_page 404 /_home.html;
    location = / {{
        include snippets/postcard-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /_home.html =404;
    }}
    location = /_home.html {{
        internal;
        include snippets/postcard-headers.conf;
        add_header Cache-Control "no-cache" always;
    }}

    # Everything else (including the hidden .tmp-* upload dirs) does not exist.
    location / {{
        return 404;
    }}
}}
